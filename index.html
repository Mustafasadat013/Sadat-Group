<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Software - Startup</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="startup-container">
        <!-- Background with animated gradient -->
        <div class="background-animation"></div>
        
        <!-- Main content area -->
        <div class="content-wrapper">
            <!-- Logo and branding -->
            <div class="brand-section">
                <div class="logo-container">
                    <div class="logo-icon">
                        <i class="fas fa-rocket"></i>
                    </div>
                </div>
                <h1 class="app-name">Your Software</h1>
                <p class="app-tagline">Ready to launch your ideas</p>
            </div>

            <!-- Loading animation -->
            <div class="loading-section">
                <div class="loading-dots">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
                <p class="loading-text">Starting up...</p>
            </div>

            <!-- Progress bar -->
            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>
                <p class="progress-text">Loading components...</p>
            </div>

            <!-- Status messages -->
            <div class="status-messages">
                <div class="status-item" data-status="initializing">
                    <i class="fas fa-cog fa-spin"></i>
                    <span>Initializing system...</span>
                </div>
                <div class="status-item" data-status="loading-modules">
                    <i class="fas fa-cube"></i>
                    <span>Loading modules...</span>
                </div>
                <div class="status-item" data-status="connecting">
                    <i class="fas fa-wifi"></i>
                    <span>Establishing connections...</span>
                </div>
                <div class="status-item" data-status="ready">
                    <i class="fas fa-check-circle"></i>
                    <span>Ready to launch</span>
                </div>
            </div>

            <!-- Version info -->
            <div class="version-info">
                <p>Version 1.0.0</p>
                <p>&copy; 2024 Your Company</p>
            </div>
        </div>

        <!-- Windows 11 style accent elements -->
        <div class="accent-elements">
            <div class="accent-circle accent-1"></div>
            <div class="accent-circle accent-2"></div>
            <div class="accent-circle accent-3"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
