<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sadat Group - Business Management System</title>

    <meta name="apple-mobile-web-app-title" content="Sadat Group">

</head>
<body>
    <!-- Full-screen startup container -->
    <div class="startup-container" id="startupContainer">
        <!-- Background image with overlay -->
        <div class="background-image" id="backgroundImage"></div>
        <div class="background-overlay"></div>
        
        <!-- Main content area -->
        <div class="startup-content">
            <!-- Left side: Time and Date -->
            <div class="time-section">
                <div class="clock" id="clock">6:30</div>
                <div class="date" id="date">Thursday, August 1</div>
                <div class="calendar-event" id="calendarEvent">
                    <i class="fas fa-calendar-alt"></i>
                    <span>Meeting with Luxe Team – 3:00 PM</span>
                </div>
            </div>
            
            <!-- Center: Welcome message -->
            <div class="welcome-section">
                <div class="welcome-icon">
                    <i class="fas fa-smile"></i>
                </div>
                <div class="welcome-text">
                    <h1>Hello, Sayed Mustafa Sadat</h1>
                    <p class="business-quote">"Excellence in every business endeavor"</p>
                </div>
            </div>
            
            <!-- Bottom: Status icons -->
            <div class="status-section">
                <div class="status-item">
                    <i class="fas fa-envelope"></i>
                    <span class="status-count" id="emailCount">12</span>
                </div>
                <div class="status-item">
                    <i class="fas fa-chart-line"></i>
                    <span class="status-text">System Online</span>
                </div>
                <div class="status-item">
                    <i class="fas fa-bell"></i>
                    <span class="status-count" id="notificationCount">3</span>
                </div>
            </div>
        </div>
        
        <!-- Interaction prompt -->
        <div class="interaction-prompt" id="interactionPrompt">
            <div class="prompt-content">
                <i class="fas fa-mouse-pointer"></i>
                <span>Click, tap, or press any key to continue</span>
            </div>
        </div>
        
        <!-- Loading overlay -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-content">
                <div class="loading-spinner"></div>
                <div class="loading-text">
                    <div class="loading-step" id="loadingStep">Initializing system...</div>
                    <div class="loading-progress">
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Audio element for welcome chime -->
    <audio id="welcomeChime" preload="auto">
        <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBSuBzvLZiTYIG2m98OScTgwOUarm7blmGgU7k9n1unEiBC13yO/eizEIHWq+8+OWT" type="audio/wav">
    </audio>

    <script src="auth.js"></script>
    <script src="theme-system.js"></script>
    <script src="startup-config.js"></script>
    <script src="startup-script.js"></script>
    <script>
        // Register service worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => console.log('SW registered'))
                    .catch(error => console.log('SW registration failed'));
            });
        }
    </script>
</body>
</html>
